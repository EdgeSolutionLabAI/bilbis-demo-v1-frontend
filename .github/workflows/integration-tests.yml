name: Integration tests

on:
  push:
    branches: [main, master]
  # Nightly run against production to catch silent breakage.
  schedule:
    - cron: '0 3 * * *'
  # Manual dispatch lets you run the full suite before a release.
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend base URL (overrides default)'
        required: false
      base_url:
        description: 'Frontend base URL (overrides default)'
        required: false

jobs:
  integration:
    name: Playwright integration tests
    runs-on: ubuntu-latest
    env:
      # On push: target Vercel preview. On schedule/dispatch: target production.
      # Override either via workflow_dispatch inputs.
      API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://bilbis-demo-v1-backend.vercel.app' }}
      BASE_URL: ${{ github.event.inputs.base_url || 'https://bilbis-demo-v1-frontend.vercel.app' }}
      FE_ORIGIN: 'https://bilbis-demo-v1-frontend.vercel.app'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run integration tests
        run: npm run test:integration

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
