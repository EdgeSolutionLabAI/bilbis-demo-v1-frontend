<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer glow triangle -->
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
    <feMerge>
      <feMergeNode in="coloredBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <!-- Main green triangle -->
  <polygon points="100,10 190,180 10,180" fill="#00cc00" stroke="#00ff00" stroke-width="3" filter="url(#glow)"/>
  <!-- Inner triangle outline for depth -->
  <polygon points="100,40 172,165 28,165" fill="none" stroke="#00ff00" stroke-width="1.5" opacity="0.6"/>
  <!-- Eye white -->
  <ellipse cx="100" cy="120" rx="30" ry="22" fill="#fffde0"/>
  <!-- Iris -->
  <ellipse cx="100" cy="120" rx="18" ry="18" fill="#c8a000"/>
  <!-- Pupil -->
  <ellipse cx="100" cy="120" rx="9" ry="13" fill="#111"/>
  <!-- Shine -->
  <ellipse cx="94" cy="113" rx="4" ry="3" fill="rgba(255,255,255,0.7)"/>
  <!-- Eyelid lines -->
  <path d="M70 120 Q100 100 130 120" stroke="#333" stroke-width="2" fill="none"/>
  <path d="M70 120 Q100 140 130 120" stroke="#333" stroke-width="2" fill="none"/>
  <!-- Radiating lines -->
  <g stroke="#00ff00" stroke-width="1" opacity="0.5">
    <line x1="100" y1="98" x2="100" y2="60"/>
    <line x1="100" y1="142" x2="100" y2="170"/>
    <line x1="70" y1="115" x2="40" y2="108"/>
    <line x1="130" y1="115" x2="160" y2="108"/>
    <line x1="78" y1="104" x2="58" y2="86"/>
    <line x1="122" y1="104" x2="142" y2="86"/>
    <line x1="78" y1="136" x2="58" y2="154"/>
    <line x1="122" y1="136" x2="142" y2="154"/>
  </g>
</svg>
