<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Shiba Inu face - tan/golden base -->
  <ellipse cx="100" cy="110" rx="75" ry="80" fill="#c8a46e"/>
  <!-- Ears -->
  <ellipse cx="42" cy="55" rx="22" ry="30" fill="#c8a46e" transform="rotate(-15 42 55)"/>
  <ellipse cx="158" cy="55" rx="22" ry="30" fill="#c8a46e" transform="rotate(15 158 55)"/>
  <ellipse cx="42" cy="55" rx="12" ry="18" fill="#e8c090" transform="rotate(-15 42 55)"/>
  <ellipse cx="158" cy="55" rx="12" ry="18" fill="#e8c090" transform="rotate(15 158 55)"/>
  <!-- White face mask area -->
  <ellipse cx="100" cy="125" rx="55" ry="50" fill="#f0e0c0"/>
  <!-- Eyes -->
  <ellipse cx="75" cy="95" rx="14" ry="14" fill="#fff"/>
  <ellipse cx="125" cy="95" rx="14" ry="14" fill="#fff"/>
  <circle cx="78" cy="93" r="9" fill="#4a2800"/>
  <circle cx="128" cy="93" r="9" fill="#4a2800"/>
  <circle cx="81" cy="90" r="3" fill="#fff"/>
  <circle cx="131" cy="90" r="3" fill="#fff"/>
  <!-- Nose -->
  <ellipse cx="100" cy="118" rx="10" ry="7" fill="#2a1a00"/>
  <!-- Mouth -->
  <path d="M88 128 Q100 140 112 128" stroke="#2a1a00" stroke-width="2" fill="none"/>
  <!-- Cheek blush -->
  <ellipse cx="60" cy="115" rx="12" ry="7" fill="rgba(255,100,100,0.4)"/>
  <ellipse cx="140" cy="115" rx="12" ry="7" fill="rgba(255,100,100,0.4)"/>
  <!-- Sunglasses (MLG style) -->
  <rect x="55" y="85" width="35" height="22" rx="4" fill="rgba(0,0,0,0.85)" stroke="#c0c0c0" stroke-width="1.5"/>
  <rect x="110" y="85" width="35" height="22" rx="4" fill="rgba(0,0,0,0.85)" stroke="#c0c0c0" stroke-width="1.5"/>
  <line x1="90" y1="96" x2="110" y2="96" stroke="#c0c0c0" stroke-width="1.5"/>
  <line x1="30" y1="96" x2="55" y2="96" stroke="#c0c0c0" stroke-width="1.5"/>
  <line x1="145" y1="96" x2="170" y2="96" stroke="#c0c0c0" stroke-width="1.5"/>
</svg>
